<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Property Inquiry | International Pioneers School Bangkok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Prompt:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif; background: #f1f5f9; color: #0f172a; }
    .card { background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(15,23,42,0.04); }
  </style>
</head>
<body class="pb-14">

  <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white shadow-lg border-b-4 border-red-600">
    <div class="max-w-5xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 text-center sm:text-left">
        <img src="https://lh3.googleusercontent.com/d/1R1aYZwaQ-IwaZizziHzJaUb6yXhabVOT" onerror="this.style.display='none'" alt="IPS Logo" class="w-14 h-14 object-contain rounded-full bg-white/10 p-1">
        <div>
          <span class="text-[11px] font-bold tracking-widest uppercase text-red-400">International Pioneers School Bangkok</span>
          <h1 class="text-xl font-extrabold tracking-tight">LOST PROPERTY INQUIRY</h1>
        </div>
      </div>
      <a href="index.html" class="px-4 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold transition">
        ← Back to Home
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 mt-8 space-y-6">
    <div class="card rounded-2xl p-5 sm:p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-slate-800">Search Verified Reported Items</h2>
        <span id="countBadge" class="px-3 py-1 rounded-full bg-blue-50 text-blue-800 text-xs font-bold">Loading...</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <input type="text" id="searchInput" placeholder="Search item, brand, color, ID..." 
               class="sm:col-span-2 rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm focus:bg-white focus:border-blue-600 outline-none">
        
        <select id="dropPointFilter" class="rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm focus:bg-white outline-none font-medium text-slate-700">
          <option value="all">📍 All Drop-off Points</option>
          <option value="Office">🏢 Office</option>
          <option value="Store room">📦 Store room</option>
          <option value="in front of Library">📚 in front of Library</option>
        </select>

        <select id="statusFilter" class="rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm focus:bg-white outline-none">
          <option value="all">All Verified Statuses</option>
          <option value="Awaiting Owner" selected>⏳ Awaiting Owner</option>
          <option value="Returned">✅ Returned to Owner</option>
        </select>
      </div>
    </div>

    <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-12 text-slate-400 text-sm">Loading items from database...</div>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-init.js";
    import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    let allItems = [];

    const q = query(collection(db, "lost_items"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      // แสดงเฉพาะรายการที่เจ้าหน้าที่ยืนยันรับของเข้าจุด Drop-off แล้ว (ตัด Pending Verification ออก)
      allItems = snapshot.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(item => item.status !== 'Pending Verification');
      updateDropPointOptions(allItems);
      filterAndRender();
    });

    function updateDropPointOptions(items) {
      const select = document.getElementById('dropPointFilter');
      const currentVal = select.value;
      const defaultPoints = ["Office", "Store room", "in front of Library"];
      const extraPoints = new Set();

      items.forEach(item => {
        if (item.dropPoint && !defaultPoints.includes(item.dropPoint)) {
          extraPoints.add(item.dropPoint);
        }
      });

      Array.from(select.querySelectorAll('.extra-opt')).forEach(el => el.remove());

      extraPoints.forEach(pt => {
        const opt = document.createElement('option');
        opt.value = pt;
        opt.text = `📍 ${pt}`;
        opt.className = 'extra-opt';
        select.appendChild(opt);
      });

      select.value = currentVal;
    }

    function filterAndRender() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const dropPoint = document.getElementById('dropPointFilter').value;
      const status = document.getElementById('statusFilter').value;

      const filtered = allItems.filter(entry => {
        const text = [entry.item, entry.brand, entry.color, entry.location, entry.details, entry.itemId, entry.category, entry.dropPoint].join(' ').toLowerCase();
        const matchKey = !keyword || text.includes(keyword);
        const itemDrop = entry.dropPoint || 'Office';
        const matchDrop = dropPoint === 'all' || itemDrop.toLowerCase() === dropPoint.toLowerCase();
        const matchStatus = status === 'all' || entry.status === status;
        return matchKey && matchDrop && matchStatus;
      });

      document.getElementById('countBadge').innerText = `${filtered.length} item(s)`;
      renderCards(filtered);
    }

    function renderCards(items) {
      const grid = document.getElementById('itemsGrid');
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full card rounded-2xl p-12 text-center text-slate-400 text-sm">No matching items found.</div>`;
        return;
      }

      grid.innerHTML = items.map(entry => {
        const h = entry.house || '';
        let border = 'border-t-slate-400';
        if (h.includes('Red')) border = 'border-t-red-500';
        else if (h.includes('Yellow')) border = 'border-t-yellow-500';
        else if (h.includes('Green')) border = 'border-t-emerald-500';
        else if (h.includes('Blue')) border = 'border-t-blue-600';

        const isReturned = entry.status === 'Returned';
        const badge = isReturned
          ? `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800">Returned</span>`
          : `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">Awaiting Owner</span>`;

        const imgHtml = (entry.imageBase64 && entry.imageBase64.startsWith('data:image'))
          ? `<div class="mb-3 rounded-xl overflow-hidden bg-slate-100 h-44 border border-slate-100">
               <img src="${entry.imageBase64}" alt="Item" class="w-full h-full object-cover">
             </div>`
          : '';

        return `
          <div class="card rounded-2xl p-5 border-t-4 ${border} flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-2">
                <span class="text-[11px] font-mono font-bold text-blue-900 bg-blue-50 px-2 py-0.5 rounded">${esc(entry.itemId)}</span>
                ${badge}
              </div>
              ${imgHtml}
              <h3 class="text-base font-extrabold text-slate-800 mb-2">${esc(entry.item)}</h3>
              
              <div class="mb-2.5 px-3 py-2 rounded-xl bg-blue-50 border border-blue-200 text-xs font-bold text-blue-950">
                📍 Pick up / Claim at: <span class="text-red-600 underline">${esc(entry.dropPoint || 'Office')}</span>
              </div>

              <div class="space-y-1 text-xs text-slate-600">
                ${entry.category ? `<p><strong>Category:</strong> ${esc(entry.category)}</p>` : ''}
                ${entry.brand !== '-' ? `<p><strong>Brand:</strong> ${esc(entry.brand)}</p>` : ''}
                <p><strong>Color:</strong> ${esc(entry.color)}</p>
                <p><strong>Found at:</strong> ${esc(entry.location)}</p>
                <p><strong>Date Found:</strong> ${esc(entry.foundDate)} ${entry.foundTime !== '-' ? '(' + esc(entry.foundTime) + ')' : ''}</p>
                ${entry.details !== '-' ? `<p class="pt-1 text-slate-500 italic">"${esc(entry.details)}"</p>` : ''}
              </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 text-[11px] text-slate-400">
              Found by: ${esc(entry.finder)} (${esc(entry.house)})
            </div>
          </div>
        `;
      }).join('');
    }

    function esc(str) {
      if (!str) return "";
      return String(str).replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t]));
    }

    document.getElementById('searchInput').addEventListener('input', filterAndRender);
    document.getElementById('dropPointFilter').addEventListener('change', filterAndRender);
    document.getElementById('statusFilter').addEventListener('change', filterAndRender);
  </script>
</body>
</html>
