<script type="module">
    import { db } from "./js/firebase-init.js";
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    onSnapshot(collection(db, "lost_items"), (snapshot) => {
      let total = 0, awaiting = 0, returned = 0;
      const houses = { Red: 0, Yellow: 0, Green: 0, Blue: 0 };

      snapshot.forEach((doc) => {
        const item = doc.data();
        // นับสถิติและคะแนนบ้านเฉพาะรายการที่เจ้าหน้าที่กดยืนยันรับของแล้วเท่านั้น
        if (item.status === 'Pending Verification') return;

        total++;
        if (item.status === 'Returned') returned++;
        else awaiting++;

        const h = item.house || '';
        if (h.includes('Red')) houses.Red++;
        else if (h.includes('Yellow')) houses.Yellow++;
        else if (h.includes('Green')) houses.Green++;
        else if (h.includes('Blue')) houses.Blue++;
      });

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statAwaiting').innerText = awaiting;
      document.getElementById('statReturned').innerText = returned;

      const maxVal = Math.max(...Object.values(houses), 1);
      ['Red', 'Yellow', 'Green', 'Blue'].forEach(color => {
        document.getElementById(`score${color}`).innerText = `${houses[color]} pt(s)`;
        document.getElementById(`bar${color}`).style.width = `${Math.round((houses[color] / maxVal) * 100)}%`;
      });
    });
  </script>
