<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Found Property Report | International Pioneers School Bangkok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Prompt:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif; background: #f1f5f9; color: #0f172a; }
    .card { background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(15,23,42,0.04); }
  </style>
</head>
<body class="pb-14">

  <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white shadow-lg border-b-4 border-red-600">
    <div class="max-w-4xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 text-center sm:text-left">
        <img src="https://lh3.googleusercontent.com/d/1R1aYZwaQ-IwaZizziHzJaUb6yXhabVOT" onerror="this.style.display='none'" alt="IPS Logo" class="w-14 h-14 object-contain rounded-full bg-white/10 p-1">
        <div>
          <span class="text-[11px] font-bold tracking-widest uppercase text-red-400">International Pioneers School Bangkok</span>
          <h1 class="text-xl font-extrabold tracking-tight">FOUND PROPERTY REPORT</h1>
        </div>
      </div>
      <a href="index.html" class="px-4 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold transition">
        ← Back to Home
      </a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 mt-8">
    <div class="card rounded-3xl p-6 sm:p-8">
      <div class="pb-4 mb-6 border-b border-slate-100">
        <h2 class="text-lg font-bold text-slate-800">Item Registration Form</h2>
        <p class="text-xs text-slate-500">Fields marked with <span class="text-red-500 font-bold">*</span> are required. House points are awarded after staff verify the item at the drop-off point.</p>
      </div>

      <form id="foundForm" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">Finder's Full Name *</label>
            <input type="text" id="finder" required placeholder="e.g., Somchai Jaidee" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Student / Staff ID *</label>
            <input type="text" id="studentId" required placeholder="e.g., 650123" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Grade / Class (Optional)</label>
            <input type="text" id="gradeClass" placeholder="e.g., Year 8B" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">School House *</label>
            <select id="house" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm bg-white">
              <option value="">-- Select School House --</option>
              <option value="Red House (Vasco da Gama)">🔴 Red House — Vasco da Gama</option>
              <option value="Yellow House (Amerigo Vespucci)">🟡 Yellow House — Amerigo Vespucci</option>
              <option value="Green House (Christopher Columbus)">🟢 Green House — Christopher Columbus</option>
              <option value="Blue House (Marco Polo)">🔵 Blue House — Marco Polo</option>
            </select>
          </div>
        </div>

        <!-- Category & Drop Item At -->
        <div class="bg-blue-50/70 p-4 rounded-2xl border border-blue-200 space-y-3">
          <div>
            <label class="block text-xs font-bold text-blue-950 mb-1">Item Category (ประเภทสิ่งของที่พบ) *</label>
            <select id="categorySelect" required class="w-full rounded-xl border border-blue-300 px-3.5 py-2.5 text-sm bg-white">
              <option value="">-- Loading Categories... --</option>
            </select>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs font-bold text-blue-950">📍 Drop Item At (จุดที่นำสิ่งของไปส่งมอบ) *</label>
              <span id="recommendedHint" class="hidden text-[11px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded"></span>
            </div>
            <select id="dropPointSelect" required class="w-full rounded-xl border border-blue-300 px-3.5 py-2.5 text-sm bg-white font-semibold text-slate-800">
              <option value="">-- Select Drop-off Point (เลือกจุดส่งมอบ) --</option>
              <option value="Office">🏢 Office (สำหรับของมีค่า เช่น กระเป๋าเงิน, เงินสด)</option>
              <option value="Store room">📦 Store room (สำหรับเครื่องเขียน, เสื้อ PE)</option>
              <option value="in front of Library">📚 in front of Library (สำหรับของเบ็ดเตล็ด เช่น กล่องข้าว, กระติกน้ำ)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Item Name *</label>
            <input type="text" id="item" required placeholder="e.g., Water Bottle, PE Shirt" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Brand (Optional)</label>
            <input type="text" id="brand" placeholder="e.g., Nike, Hydro Flask" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Primary Color *</label>
            <select id="color" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm bg-white">
              <option value="">-- Select Color (เลือกสี) --</option>
              <option value="Black (สีดำ)">⚫ Black (สีดำ)</option>
              <option value="White (สีขาว)">⚪ White (สีขาว)</option>
              <option value="Grey / Silver (สีเทา / สีเงิน)">🔘 Grey / Silver (สีเทา / สีเงิน)</option>
              <option value="Navy Blue (สีกรมท่า)">🔷 Navy Blue (สีกรมท่า)</option>
              <option value="Blue (สีน้ำเงิน / สีฟ้า)">🔵 Blue (สีน้ำเงิน / สีฟ้า)</option>
              <option value="Red (สีแดง)">🔴 Red (สีแดง)</option>
              <option value="Pink (สีชมพู)">🩷 Pink (สีชมพู)</option>
              <option value="Yellow (สีเหลือง)">🟡 Yellow (สีเหลือง)</option>
              <option value="Orange (สีส้ม)">🟠 Orange (สีส้ม)</option>
              <option value="Green (สีเขียว)">🟢 Green (สีเขียว)</option>
              <option value="Purple (สีม่วง)">🟣 Purple (สีม่วง)</option>
              <option value="Brown / Beige (สีน้ำตาล / สีครีม)">🟤 Brown / Beige (สีน้ำตาล / สีครีม)</option>
              <option value="Multicolor (หลากสี)">🌈 Multicolor (หลากสี)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Location Found (จุดที่เก็บได้) *</label>
            <input type="text" id="location" required placeholder="e.g., Canteen, Football Field" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Date Found *</label>
            <input type="date" id="foundDate" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Time Found (Optional)</label>
            <input type="time" id="foundTime" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Additional Details (Optional)</label>
          <textarea id="details" rows="2" placeholder="Any distinguishing marks or notes..." class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm"></textarea>
        </div>

        <div class="bg-amber-50/70 p-4 rounded-2xl border border-amber-200">
          <label class="block text-xs font-bold text-slate-800 mb-1">📸 Photo Evidence (ถ่ายรูปสิ่งของที่พบ — บังคับแนบรูป) *</label>
          <input type="file" id="itemImage" accept="image/*" required class="text-xs">
          <img id="imagePreview" class="hidden mt-2 max-h-36 rounded-lg border">
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-xl bg-blue-900 hover:bg-blue-950 text-white font-bold text-sm shadow transition">
          Submit Found Property Report
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-init.js";
    import { collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    document.getElementById('foundDate').valueAsDate = new Date();
    let compressedBase64 = "";
    let categoriesMap = {};

    async function loadCategories() {
      const select = document.getElementById('categorySelect');
      const dropSelect = document.getElementById('dropPointSelect');
      try {
        const snap = await getDocs(collection(db, "categories"));
        
        if (snap.empty) {
          const fallback = [
            { name: "1. Valuables (ของมีค่า)", examples: "Wallet, Cash", dropPoint: "Office" },
            { name: "2. Stationery & PE Kit (เครื่องเขียน / ชุดพละ)", examples: "Pens, Pencils, PE Shirt", dropPoint: "Store room" },
            { name: "3. Miscellaneous (เบ็ดเตล็ด)", examples: "Lunch Box, Water Bottle, Sweater", dropPoint: "in front of Library" }
          ];
          select.innerHTML = `<option value="">-- Select Item Category --</option>` + fallback.map(c => {
            categoriesMap[c.name] = c.dropPoint;
            return `<option value="${c.name}">${c.name} — e.g., ${c.examples}</option>`;
          }).join('');
          return;
        }

        const customDropPoints = new Set(["Office", "Store room", "in front of Library"]);
        const docsList = snap.docs.map(d => d.data()).sort((a, b) => (a.name || '').localeCompare(b.name || ''));

        select.innerHTML = `<option value="">-- Select Item Category --</option>` + docsList.map(c => {
          categoriesMap[c.name] = c.dropPoint;
          if (c.dropPoint) customDropPoints.add(c.dropPoint);
          return `<option value="${c.name}">${c.name} — e.g., ${c.examples || ''}</option>`;
        }).join('');

        customDropPoints.forEach(pt => {
          const exists = Array.from(dropSelect.options).some(opt => opt.value === pt);
          if (!exists) {
            const opt = document.createElement('option');
            opt.value = pt;
            opt.text = `📍 ${pt}`;
            dropSelect.appendChild(opt);
          }
        });
      } catch (err) {
        console.error("Error loading categories:", err);
        select.innerHTML = `<option value="">-- Error loading categories --</option>`;
      }
    }
    loadCategories();

    document.getElementById('categorySelect').addEventListener('change', function() {
      const selected = this.value;
      const dropSelect = document.getElementById('dropPointSelect');
      const hint = document.getElementById('recommendedHint');

      if (selected && categoriesMap[selected]) {
        const recommended = categoriesMap[selected];
        dropSelect.value = recommended;
        hint.innerText = `Recommended: ${recommended}`;
        hint.classList.remove('hidden');
      } else {
        hint.classList.add('hidden');
      }
    });

    document.getElementById('itemImage').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 450;
          let w = img.width, h = img.height;
          if (w > MAX_WIDTH) { h = Math.round((h * MAX_WIDTH) / w); w = MAX_WIDTH; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
          const prev = document.getElementById('imagePreview');
          prev.src = compressedBase64;
          prev.classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ป้องกันการส่งสแปมรัว ๆ (ไม่เกิน 3 ครั้งใน 10 นาที)
    function checkSpamLimit() {
      const now = Date.now();
      const history = JSON.parse(localStorage.getItem('ips_submit_times') || '[]').filter(t => now - t < 10 * 60 * 1000);
      if (history.length >= 3) return false;
      history.push(now);
      localStorage.setItem('ips_submit_times', JSON.stringify(history));
      return true;
    }

    document.getElementById('foundForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!compressedBase64) {
        Swal.fire('Photo Required', 'Please upload or take a photo of the found item.', 'warning');
        return;
      }

      if (!checkSpamLimit()) {
        Swal.fire('Submission Limit Reached', 'You have submitted multiple reports recently. Please wait 10 minutes before submitting again.', 'warning');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Saving to Cloud...";

      const selectedCategory = document.getElementById('categorySelect').value;
      const chosenDropPoint = document.getElementById('dropPointSelect').value;

      const now = new Date();
      const ym = String(now.getFullYear()).slice(-2) + String(now.getMonth() + 1).padStart(2, '0');
      const rand = Math.floor(100 + Math.random() * 900);
      const itemId = `IPS-${ym}-${rand}`;

      try {
        await addDoc(collection(db, "lost_items"), {
          itemId: itemId,
          finder: document.getElementById('finder').value.trim(),
          studentId: document.getElementById('studentId').value.trim(),
          gradeClass: document.getElementById('gradeClass').value.trim() || "-",
          house: document.getElementById('house').value,
          category: selectedCategory,
          dropPoint: chosenDropPoint,
          item: document.getElementById('item').value.trim(),
          brand: document.getElementById('brand').value.trim() || "-",
          color: document.getElementById('color').value,
          location: document.getElementById('location').value.trim(),
          foundDate: document.getElementById('foundDate').value,
          foundTime: document.getElementById('foundTime').value || "-",
          details: document.getElementById('details').value.trim() || "-",
          imageBase64: compressedBase64,
          status: "Pending Verification",
          createdAt: serverTimestamp()
        });

        Swal.fire({
          icon: 'success',
          title: 'Report Submitted!',
          html: `
            <div class="space-y-2 text-sm">
              <p>Reference ID: <strong class="text-blue-900 text-lg">${itemId}</strong></p>
              <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-950">
                📍 Next Step: Please deliver the item to<br>
                <strong class="text-base text-red-600">${chosenDropPoint}</strong><br>
                <span class="text-xs text-slate-600">(House points will be awarded once staff confirm receipt)</span>
              </div>
            </div>
          `,
          confirmButtonText: 'Done',
          confirmButtonColor: '#1e3a8a'
        }).then(() => {
          window.location.href = "index.html";
        });
      } catch (err) {
        btn.disabled = false;
        btn.innerText = "Submit Found Property Report";
        Swal.fire('Error', err.message, 'error');
      }
    });
  </script>
</body>
</html>
